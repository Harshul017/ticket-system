<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ticket Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F4EF;
    --surface: #FFFFFF;
    --ink: #141414;
    --muted: #706E66;
    --line: #E5E2D8;
    --danger: #B3261E;
    --danger-bg: #FBEAE8;
    --ok-bg: #EAF3EA;
    --ok: #1E5E2E;
    --dot-open: #2F6FED;
    --dot-progress: #C9860A;
    --dot-closed: #8A8A82;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .display { font-family: 'Space Grotesk', 'Inter', sans-serif; }

  button { font-family: inherit; cursor: pointer; }

  button:focus-visible,
  input:focus-visible,
  textarea:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }

  /* ---------- Pills (shared language: tabs, filters, badges) ---------- */

  .pill-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .pill {
    border: 1.5px solid var(--ink);
    background: transparent;
    color: var(--ink);
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.01em;
  }

  .pill.active {
    background: var(--ink);
    color: var(--bg);
  }

  .pill:hover:not(.active) { background: rgba(20,20,20,0.05); }

  /* ---------- Auth screen ---------- */

  .auth-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .auth-wrap {
    width: 100%;
    max-width: 380px;
  }

  .wordmark {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
  }

  .auth-wrap > .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 28px;
  }

  .field { margin-bottom: 16px; }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 6px;
  }

  .field .hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }

  input, textarea {
    width: 100%;
    font-size: 14px;
    padding: 11px 14px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
  }

  input:focus, textarea:focus { border-color: var(--ink); }

  textarea { resize: vertical; min-height: 76px; }

  .btn-primary {
    width: 100%;
    background: var(--ink);
    color: var(--bg);
    border: 1.5px solid var(--ink);
    border-radius: 8px;
    padding: 12px 0;
    font-size: 14px;
    font-weight: 600;
  }

  .btn-primary:hover { opacity: 0.85; }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }

  .banner {
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 16px;
    display: none;
  }

  .banner.visible { display: block; }
  .banner.error { background: var(--danger-bg); color: var(--danger); }
  .banner.ok { background: var(--ok-bg); color: var(--ok); }

  /* ---------- Dashboard ---------- */

  .app { display: none; min-height: 100vh; }
  .app.visible { display: block; }

  .topbar {
    border-bottom: 1.5px solid var(--ink);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .topbar .who {
    display: flex;
    align-items: center;
    gap: 18px;
    font-size: 13px;
    color: var(--muted);
  }

  .btn-outline {
    background: transparent;
    border: 1.5px solid var(--ink);
    border-radius: 8px;
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
  }

  .btn-outline:hover { background: rgba(20,20,20,0.05); }

  .layout {
    max-width: 1080px;
    margin: 0 auto;
    padding: 40px 32px 80px;
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 40px;
    align-items: start;
  }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; padding: 28px 20px 60px; }
  }

  .panel-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 16px;
  }

  .btn-small-primary {
    width: 100%;
    background: var(--ink);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    padding: 11px 0;
    font-size: 13px;
    font-weight: 600;
  }

  .btn-small-primary:hover { opacity: 0.85; }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
  }

  .section-header h2 {
    font-size: 20px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .ticket-list {
    display: flex;
    flex-direction: column;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }

  .ticket-row {
    background: var(--surface);
    padding: 18px 20px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }

  .ticket-main { min-width: 0; }

  .ticket-title {
    font-weight: 600;
    font-size: 14px;
    margin: 0 0 4px;
  }

  .ticket-desc {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 8px;
    word-break: break-word;
  }

  .ticket-meta {
    font-size: 12px;
    color: var(--muted);
  }

  .ticket-side {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
    flex-shrink: 0;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    padding: 4px 12px 4px 8px;
    border-radius: 999px;
    border: 1.5px solid var(--ink);
    white-space: nowrap;
  }

  .badge .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .badge.open .dot { background: var(--dot-open); }
  .badge.in_progress .dot { background: var(--dot-progress); }
  .badge.closed .dot { background: var(--dot-closed); }

  .btn-small {
    background: transparent;
    color: var(--ink);
    border: 1.5px solid var(--ink);
    border-radius: 7px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
  }

  .btn-small:hover { background: rgba(20,20,20,0.05); }

  .empty-state {
    text-align: center;
    padding: 56px 16px;
    color: var(--muted);
    font-size: 14px;
    border: 1.5px dashed var(--line);
    border-radius: 10px;
  }
</style>
</head>
<body>

  <!-- ===== Auth screen ===== -->
  <div class="auth-screen" id="auth-screen">
    <div class="auth-wrap">
      <p class="wordmark display">Ticket Desk</p>
      <p class="subtitle">Track and manage your own support tickets.</p>

      <div class="pill-row" style="margin-bottom:28px;">
        <button class="pill active" id="tab-login" onclick="setAuthMode('login')">Log in</button>
        <button class="pill" id="tab-register" onclick="setAuthMode('register')">Create account</button>
      </div>

      <div class="banner error" id="auth-error"></div>

      <form id="login-form" onsubmit="return handleLogin(event)">
        <div class="field">
          <label for="login-email">Email</label>
          <input type="text" id="login-email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" autocomplete="current-password" required>
        </div>
        <button class="btn-primary" type="submit" id="login-submit">Log in</button>
      </form>

      <form id="register-form" style="display:none;" onsubmit="return handleRegister(event)">
        <div class="field">
          <label for="register-name">Name <span style="color:var(--muted); font-weight:400;">(optional)</span></label>
          <input type="text" id="register-name" autocomplete="name">
        </div>
        <div class="field">
          <label for="register-email">Email</label>
          <input type="text" id="register-email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="register-password">Password</label>
          <input type="password" id="register-password" autocomplete="new-password" required>
          <div class="hint">At least 8 characters, no spaces.</div>
        </div>
        <button class="btn-primary" type="submit" id="register-submit">Create account</button>
      </form>
    </div>
  </div>

  <!-- ===== Dashboard ===== -->
  <div class="app" id="app">
    <div class="topbar">
      <p class="wordmark display" style="font-size:20px; margin:0;">Ticket Desk</p>
      <div class="who">
        <span id="who-email"></span>
        <button class="btn-outline" onclick="handleLogout()">Log out</button>
      </div>
    </div>

    <div class="layout">
      <div>
        <p class="panel-title">New ticket</p>
        <div class="banner error" id="create-error"></div>
        <form id="create-form" onsubmit="return handleCreateTicket(event)">
          <div class="field">
            <label for="ticket-title">Title</label>
            <input type="text" id="ticket-title" required>
          </div>
          <div class="field">
            <label for="ticket-desc">Description</label>
            <textarea id="ticket-desc"></textarea>
          </div>
          <button class="btn-small-primary" type="submit" id="create-submit">Create ticket</button>
        </form>
      </div>

      <div>
        <div class="section-header">
          <h2>Your tickets</h2>
          <div class="pill-row" id="filter-row">
            <button class="pill active" data-filter="all" onclick="setFilter('all')">All</button>
            <button class="pill" data-filter="open" onclick="setFilter('open')">Open</button>
            <button class="pill" data-filter="in_progress" onclick="setFilter('in_progress')">In progress</button>
            <button class="pill" data-filter="closed" onclick="setFilter('closed')">Closed</button>
          </div>
        </div>
        <div id="ticket-list-wrap"></div>
      </div>
    </div>
  </div>

<script>
  // Points at the deployed backend on Render.
  const API_BASE = 'https://ticket-system-2vw9.onrender.com';

  let token = localStorage.getItem('ticketdesk_token') || null;
  let userEmail = localStorage.getItem('ticketdesk_email') || '';
  let allTickets = [];
  let currentFilter = 'all';

  // ---------- Auth screen wiring ----------

  function setAuthMode(mode) {
    const isLogin = mode === 'login';
    document.getElementById('tab-login').classList.toggle('active', isLogin);
    document.getElementById('tab-register').classList.toggle('active', !isLogin);
    document.getElementById('login-form').style.display = isLogin ? 'block' : 'none';
    document.getElementById('register-form').style.display = isLogin ? 'none' : 'block';
    hideBanner('auth-error');
  }

  function showBanner(elId, message, kind) {
    const el = document.getElementById(elId);
    el.textContent = message;
    el.classList.remove('error', 'ok');
    el.classList.add(kind || 'error', 'visible');
  }

  function hideBanner(elId) {
    document.getElementById(elId).classList.remove('visible');
  }

  async function handleLogin(e) {
    e.preventDefault();
    hideBanner('auth-error');
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const btn = document.getElementById('login-submit');
    btn.disabled = true;
    btn.textContent = 'Logging in…';
    try {
      const res = await fetch(`${API_BASE}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');
      token = data.token;
      userEmail = email;
      localStorage.setItem('ticketdesk_token', token);
      localStorage.setItem('ticketdesk_email', userEmail);
      enterApp();
    } catch (err) {
      showBanner('auth-error', err.message || 'Could not reach the server.', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Log in';
    }
    return false;
  }

  async function handleRegister(e) {
    e.preventDefault();
    hideBanner('auth-error');
    const name = document.getElementById('register-name').value.trim();
    const email = document.getElementById('register-email').value.trim();
    const password = document.getElementById('register-password').value;
    const btn = document.getElementById('register-submit');
    btn.disabled = true;
    btn.textContent = 'Creating account…';
    try {
      const res = await fetch(`${API_BASE}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Registration failed');
      setAuthMode('login');
      document.getElementById('login-email').value = email;
      showBanner('auth-error', 'Account created. Log in below.', 'ok');
    } catch (err) {
      showBanner('auth-error', err.message || 'Could not reach the server.', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Create account';
    }
    return false;
  }

  function handleLogout() {
    token = null;
    localStorage.removeItem('ticketdesk_token');
    localStorage.removeItem('ticketdesk_email');
    document.getElementById('app').classList.remove('visible');
    document.getElementById('auth-screen').style.display = 'flex';
  }

  // ---------- Dashboard ----------

  function enterApp() {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app').classList.add('visible');
    document.getElementById('who-email').textContent = userEmail;
    loadTickets();
  }

  async function apiFetch(path, options = {}) {
    const res = await fetch(`${API_BASE}${path}`, {
      ...options,
      headers: {
        ...(options.headers || {}),
        'Authorization': `Bearer ${token}`
      }
    });
    if (res.status === 401) {
      handleLogout();
      throw new Error('Session expired. Please log in again.');
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
  }

  async function loadTickets() {
    const wrap = document.getElementById('ticket-list-wrap');
    try {
      allTickets = await apiFetch('/tickets');
      renderTickets();
    } catch (err) {
      wrap.innerHTML = `<div class="empty-state">${escapeHtml(err.message)}</div>`;
    }
  }

  // Filtering happens entirely client-side over the tickets we already
  // fetched from GET /tickets — no extra API calls, no backend changes.
  function setFilter(filter) {
    currentFilter = filter;
    document.querySelectorAll('#filter-row .pill').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.filter === filter);
    });
    renderTickets();
  }

  function renderTickets() {
    const wrap = document.getElementById('ticket-list-wrap');
    const tickets = currentFilter === 'all'
      ? allTickets
      : allTickets.filter(t => t.status === currentFilter);

    if (!tickets || tickets.length === 0) {
      const msg = currentFilter === 'all'
        ? 'No tickets yet. Create your first one to get started.'
        : `No ${statusLabel(currentFilter).toLowerCase()} tickets.`;
      wrap.innerHTML = `<div class="empty-state">${msg}</div>`;
      return;
    }

    const nextAction = {
      open: { label: 'Start progress', next: 'in_progress' },
      in_progress: { label: 'Close ticket', next: 'closed' },
      closed: null
    };

    wrap.innerHTML = `<div class="ticket-list">${tickets.map(t => {
      const action = nextAction[t.status];
      const actionBtn = action
        ? `<button class="btn-small" onclick="handleUpdateStatus(${t.id}, '${action.next}')">${action.label}</button>`
        : '';
      return `
        <div class="ticket-row">
          <div class="ticket-main">
            <p class="ticket-title">${escapeHtml(t.title)}</p>
            ${t.description ? `<p class="ticket-desc">${escapeHtml(t.description)}</p>` : ''}
            <p class="ticket-meta">Updated ${formatDate(t.updated_at)}</p>
          </div>
          <div class="ticket-side">
            <span class="badge ${t.status}"><span class="dot"></span>${statusLabel(t.status)}</span>
            ${actionBtn}
          </div>
        </div>
      `;
    }).join('')}</div>`;
  }

  async function handleUpdateStatus(id, newStatus) {
    try {
      await apiFetch(`/tickets/${id}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus })
      });
      loadTickets();
    } catch (err) {
      alert(err.message);
    }
  }

  async function handleCreateTicket(e) {
    e.preventDefault();
    hideBanner('create-error');
    const title = document.getElementById('ticket-title').value.trim();
    const description = document.getElementById('ticket-desc').value.trim();
    const btn = document.getElementById('create-submit');
    btn.disabled = true;
    btn.textContent = 'Creating…';
    try {
      await apiFetch('/tickets', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, description })
      });
      document.getElementById('ticket-title').value = '';
      document.getElementById('ticket-desc').value = '';
      loadTickets();
    } catch (err) {
      showBanner('create-error', err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Create ticket';
    }
    return false;
  }

  // ---------- Helpers ----------

  function statusLabel(status) {
    return { open: 'Open', in_progress: 'In progress', closed: 'Closed' }[status] || status;
  }

  function formatDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  // ---------- Boot ----------

  if (token) {
    enterApp();
  }
</script>

</body>
</html>
